# Edge for bilibili-live H5 plugin (same-origin /api + /ws)
# Usage: nginx -c /workspace/blive-deploy/nginx/nginx.conf
# For TLS: terminate with certbot / Cloudflare / put cloudflared in front of :8080

worker_processes auto;
error_log /tmp/blive-nginx-error.log warn;
pid /tmp/blive-nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name _;
    root /workspace/blive-deploy/current;
    index index.html;

    # Bilibili iframe — never DENY
    add_header Content-Security-Policy "frame-ancestors https://play-live.bilibili.com https://*.bilibili.com 'self'" always;
    add_header X-Frame-Options "ALLOW-FROM https://play-live.bilibili.com/" always;

    location /api/ {
      proxy_pass http://127.0.0.1:8787;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://127.0.0.1:8787;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
