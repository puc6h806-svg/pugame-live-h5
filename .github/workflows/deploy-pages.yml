# GitHub Actions → Cloudflare Pages
# Secrets (never commit): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# After first deploy: registrar CNAME/ALIAS pugame.site → pugame-live-h5.pages.dev
# (this Cloudflare account has no zone, so a Worker route on pugame.site/* cannot
# attach until the domain is added here and nameservers are moved).
# Same-origin /api + /ws are Pages Functions in cloudflare/functions/, which call
# cloudflare/worker-same-origin.js. BACKEND_ORIGIN below is plain config, not a secret.
# Confirm response headers are NOT X-Frame-Options: SAMEORIGIN.

name: Deploy H5 to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

env:
  FRONTEND_PATH: bilibili-live-h5-plugin
  CF_PAGES_PROJECT: pugame-live-h5
  NODE_VERSION: "20"
  # Not a secret. Pages Functions read env.BACKEND_ORIGIN and fall back to this
  # same URL inside cloudflare/worker-same-origin.js when the project var is unset.
  BACKEND_ORIGIN: http://111.231.164.192:8787
  PAGES_ORIGIN: https://pugame-live-h5.pages.dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install & build frontend
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          # Same-origin on https://pugame.site — leave empty
          VITE_API_BASE: ""
          VITE_WS_URL: ""
          VITE_MOCK: "0"
        run: |
          npm ci
          npm run build

      - name: Copy Cloudflare Pages _headers / _redirects
        run: |
          SRC="cloudflare"
          if [ ! -d "$SRC" ]; then
            SRC="blive-deploy/github/cloudflare"
          fi
          cp "$SRC/_headers" "${{ env.FRONTEND_PATH }}/dist/_headers"
          if [ -f "$SRC/_redirects" ]; then
            cp "$SRC/_redirects" "${{ env.FRONTEND_PATH }}/dist/_redirects"
          fi

      # wrangler pages deploy reads <cwd>/functions. Keep the action at the repo
      # root (same as the existing Pages deploy) and point ./functions at the
      # source under cloudflare/functions. Those files import worker-same-origin.js.
      - name: Expose Pages Functions to Wrangler
        run: |
          ln -sfn cloudflare/functions functions
          # Runtime fallback lives in the Worker module. Fail the job if it drifts
          # from this workflow's plain BACKEND_ORIGIN.
          grep -F "${BACKEND_ORIGIN}" cloudflare/worker-same-origin.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.FRONTEND_PATH }}/dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main
